<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Table Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Borders -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="borderActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow for lines -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Marker arrows for relationships -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="circleMarker" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="5" fill="#38bdf8"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .table-header { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .field-name { font-family: monospace; font-size: 11px; fill: #cbd5e1; }
    .field-type { font-family: monospace; font-size: 10px; fill: #64748b; }
    .pk { font-weight: 700; fill: #f59e0b; }
    .fk { font-weight: 700; fill: #38bdf8; }
    .relationship-line { fill: none; stroke: #10b981; stroke-width: 1.5; opacity: 0.7; }
    .relationship-line-secondary { fill: none; stroke: #38bdf8; stroke-width: 1.5; opacity: 0.6; }
    .legend-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.03">
    <path d="M 0,30 L 1000,30 M 0,60 L 1000,60 M 0,90 L 1000,90 M 0,120 L 1000,120 M 0,150 L 1000,150 M 0,180 L 1000,180 M 0,210 L 1000,210 M 0,240 L 1000,240 M 0,270 L 1000,270 M 0,300 L 1000,300 M 0,330 L 1000,330 M 0,360 L 1000,360 M 0,390 L 1000,390 M 0,420 L 1000,420 M 0,450 L 1000,450 M 0,480 L 1000,480 M 0,510 L 1000,510 M 0,540 L 1000,540 M 0,570 L 1000,570 M 0,600 L 1000,600 M 0,630 L 1000,630" stroke="#ffffff" stroke-width="1"/>
    <path d="M 30,0 L 30,650 M 60,0 L 60,650 M 90,0 L 90,650 M 120,0 L 120,650 M 150,0 L 150,650 M 180,0 L 180,650 M 210,0 L 210,650 M 240,0 L 240,650 M 270,0 L 270,650 M 300,0 L 300,650 M 330,0 L 330,650 M 360,0 L 360,650 M 390,0 L 390,650 M 420,0 L 420,650 M 450,0 L 450,650 M 480,0 L 480,650 M 510,0 L 510,650 M 540,0 L 540,650 M 570,0 L 570,650 M 60,0 L 60,650 M 630,0 L 630,650 M 660,0 L 660,650 M 690,0 L 690,650 M 720,0 L 720,650 M 750,0 L 750,650 M 780,0 L 780,650 M 810,0 L 810,650 M 840,0 L 840,650 M 870,0 L 870,650 M 900,0 L 900,650 M 930,0 L 930,650 M 960,0 L 960,650" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Header -->
  <g transform="translate(45, 45)">
    <text x="0" y="0" class="title">MODELO DE BANCO DE DADOS RELACIONAL</text>
    <text x="0" y="20" class="subtitle">Mapeamento físico do banco de dados db_PedeRoca e suas relações de integridade referencial</text>
  </g>

  <!-- Legend -->
  <g transform="translate(730, 25)">
    <rect width="220" height="45" rx="6" fill="#1e293b" opacity="0.8" stroke="#334155" stroke-width="1"/>
    <!-- PK -->
    <circle cx="15" cy="15" r="4" fill="#f59e0b"/>
    <text x="25" y="18" class="legend-text">Chave Primária (PK)</text>
    <!-- FK -->
    <circle cx="15" cy="30" r="4" fill="#38bdf8"/>
    <text x="25" y="33" class="legend-text">Chave Estrangeira (FK)</text>
    <!-- 1-N -->
    <path d="M 130,22 L 155,22" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="165" y="26" class="legend-text">Relação 1:N</text>
  </g>

  <!-- ================= RELATIONSHIP CONNECTIONS ================= -->
  <!-- tb_usuarios(id_usuario) -> tb_carrinhoCompras(id_usuario) -->
  <path d="M 245,210 C 275,210 275,120 330,120" class="relationship-line-secondary" marker-start="url(#circleMarker)" marker-end="url(#arrow)"/>

  <!-- tb_usuarios(id_usuario) -> tb_compras(id_usuario) -->
  <path d="M 245,210 C 295,210 295,490 330,490" class="relationship-line-secondary" marker-start="url(#circleMarker)" marker-end="url(#arrow)"/>

  <!-- tb_usuarios(id_usuario) -> tb_favoritoProdutos(id_usuario) -->
  <path d="M 245,210 C 295,210 295,310 330,310" class="relationship-line-secondary" marker-start="url(#circleMarker)" marker-end="url(#arrow)"/>

  <!-- tb_carrinhoCompras(id_carrinhoCompra) -> tb_itensCarrinho(id_carrinhoCompra) -->
  <path d="M 525,120 L 595,120" class="relationship-line" marker-start="url(#circleMarker)" marker-end="url(#arrow)"/>

  <!-- tb_carrinhoCompras(id_carrinhoCompra) -> tb_compras(id_carrinhoCompra) -->
  <path d="M 427,165 C 427,240 427,330 427,450" class="relationship-line" marker-start="url(#circleMarker)" marker-end="url(#arrow)"/>

  <!-- tb_produtos(id_produto) -> tb_itensCarrinho(id_produto) -->
  <path d="M 755,230 C 720,230 720,150 690,150" class="relationship-line" marker-start="url(#circleMarker)" marker-end="url(#arrow)"/>

  <!-- tb_produtos(id_produto) -> tb_favoritoProdutos(id_produto) -->
  <path d="M 755,230 C 720,230 720,340 525,340" class="relationship-line" marker-start="url(#circleMarker)" marker-end="url(#arrow)"/>


  <!-- ================= TABLE CARDS ================= -->

  <!-- 1. tb_usuarios (LEFT COLUMN) -->
  <g transform="translate(45, 90)" filter="url(#shadow)">
    <rect width="200" height="340" rx="8" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
    <rect width="200" height="30" rx="8" fill="#1e293b"/>
    <text x="15" y="20" class="table-header">tb_usuarios</text>
    
    <g transform="translate(15, 50)">
      <!-- Fields -->
      <text x="0" y="10" class="field-name pk">id_usuario</text>
      <text x="120" y="10" class="field-type">INT [PK]</text>
      
      <text x="0" y="30" class="field-name">nome</text>
      <text x="120" y="30" class="field-type">VARCHAR</text>
      
      <text x="0" y="50" class="field-name">cpf</text>
      <text x="120" y="50" class="field-type">VARCHAR</text>

      <text x="0" y="70" class="field-name">telefone</text>
      <text x="120" y="70" class="field-type">VARCHAR</text>

      <text x="0" y="90" class="field-name">e_mail</text>
      <text x="120" y="90" class="field-type">VARCHAR</text>

      <text x="0" y="110" class="field-name">senha</text>
      <text x="120" y="110" class="field-type">VARCHAR</text>

      <text x="0" y="130" class="field-name">nivel_acesso</text>
      <text x="120" y="130" class="field-type">INT</text>

      <text x="0" y="150" class="field-name">cep</text>
      <text x="120" y="150" class="field-type">VARCHAR</text>

      <text x="0" y="170" class="field-name">logradouro</text>
      <text x="120" y="170" class="field-type">VARCHAR</text>

      <text x="0" y="190" class="field-name">numero</text>
      <text x="120" y="190" class="field-type">INT</text>

      <text x="0" y="210" class="field-name">bairro</text>
      <text x="120" y="210" class="field-type">VARCHAR</text>

      <text x="0" y="230" class="field-name">cidade</text>
      <text x="120" y="230" class="field-type">VARCHAR</text>

      <text x="0" y="250" class="field-name">uf</text>
      <text x="120" y="250" class="field-type">VARCHAR</text>

      <text x="0" y="270" class="field-name">ativo</text>
      <text x="120" y="270" class="field-type">BIT</text>
    </g>
  </g>

  <!-- 2. tb_carrinhoCompras (MIDDLE COLUMN TOP) -->
  <g transform="translate(325, 90)" filter="url(#shadow)">
    <rect width="200" height="110" rx="8" fill="url(#cardGrad)" stroke="url(#borderActive)" stroke-width="1.5"/>
    <rect width="200" height="30" rx="8" fill="#064e3b"/>
    <text x="15" y="20" class="table-header">tb_carrinhoCompras</text>
    
    <g transform="translate(15, 50)">
      <text x="0" y="10" class="field-name pk">id_carrinhoCompra</text>
      <text x="120" y="10" class="field-type">INT [PK]</text>
      
      <text x="0" y="30" class="field-name fk">id_usuario</text>
      <text x="120" y="30" class="field-type">INT [FK]</text>
      
      <text x="0" y="50" class="field-name">ativo</text>
      <text x="120" y="50" class="field-type">BIT</text>
    </g>
  </g>

  <!-- 3. tb_itensCarrinho (MIDDLE COLUMN MIDDLE-HIGH) -->
  <g transform="translate(595, 90)" filter="url(#shadow)">
    <rect width="200" height="130" rx="8" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
    <rect width="200" height="30" rx="8" fill="#1e293b"/>
    <text x="15" y="20" class="table-header">tb_itensCarrinho</text>
    
    <g transform="translate(15, 50)">
      <text x="0" y="10" class="field-name pk">id_item</text>
      <text x="120" y="10" class="field-type">INT [PK]</text>
      
      <text x="0" y="30" class="field-name fk">id_carrinhoCompra</text>
      <text x="120" y="30" class="field-type">INT [FK]</text>
      
      <text x="0" y="50" class="field-name fk">id_produto</text>
      <text x="120" y="50" class="field-type">INT [FK]</text>

      <text x="0" y="70" class="field-name">quantidade</text>
      <text x="120" y="70" class="field-type">INT</text>
    </g>
  </g>

  <!-- 4. tb_favoritoProdutos (MIDDLE COLUMN MIDDLE-LOW) -->
  <g transform="translate(325, 250)" filter="url(#shadow)">
    <rect width="200" height="110" rx="8" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
    <rect width="200" height="30" rx="8" fill="#1e293b"/>
    <text x="15" y="20" class="table-header">tb_favoritoProdutos</text>
    
    <g transform="translate(15, 50)">
      <text x="0" y="10" class="field-name pk">id_favorito</text>
      <text x="120" y="10" class="field-type">INT [PK]</text>
      
      <text x="0" y="30" class="field-name fk">id_produto</text>
      <text x="120" y="30" class="field-type">INT [FK]</text>
      
      <text x="0" y="50" class="field-name fk">id_usuario</text>
      <text x="120" y="50" class="field-type">INT [FK]</text>
    </g>
  </g>

  <!-- 5. tb_compras (MIDDLE COLUMN BOTTOM) -->
  <g transform="translate(325, 410)" filter="url(#shadow)">
    <rect width="200" height="190" rx="8" fill="url(#cardGrad)" stroke="url(#borderActive)" stroke-width="1.5"/>
    <rect width="200" height="30" rx="8" fill="#064e3b"/>
    <text x="15" y="20" class="table-header">tb_compras</text>
    
    <g transform="translate(15, 50)">
      <text x="0" y="10" class="field-name pk">id_compra</text>
      <text x="120" y="10" class="field-type">INT [PK]</text>
      
      <text x="0" y="30" class="field-name fk">id_carrinhoCompra</text>
      <text x="120" y="30" class="field-type">INT [FK]</text>
      
      <text x="0" y="50" class="field-name fk">id_usuario</text>
      <text x="120" y="50" class="field-type">INT [FK]</text>

      <text x="0" y="70" class="field-name">data_compra</text>
      <text x="120" y="70" class="field-type">DATE</text>

      <text x="0" y="90" class="field-name">valor_total</text>
      <text x="120" y="90" class="field-type">DECIMAL</text>

      <text x="0" y="110" class="field-name">forma_pagamento</text>
      <text x="120" y="110" class="field-type">INT</text>

      <text x="0" y="130" class="field-name">status</text>
      <text x="120" y="130" class="field-type">VARCHAR</text>
    </g>
  </g>

  <!-- 6. tb_produtos (RIGHT COLUMN) -->
  <g transform="translate(755, 90)" filter="url(#shadow)">
    <rect width="200" height="230" rx="8" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
    <rect width="200" height="30" rx="8" fill="#1e293b"/>
    <text x="15" y="20" class="table-header">tb_produtos</text>
    
    <g transform="translate(15, 50)">
      <text x="0" y="10" class="field-name pk">id_produto</text>
      <text x="120" y="10" class="field-type">INT [PK]</text>
      
      <text x="0" y="30" class="field-name">nome</text>
      <text x="120" y="30" class="field-type">VARCHAR</text>
      
      <text x="0" y="50" class="field-name">descricao</text>
      <text x="120" y="50" class="field-type">VARCHAR</text>

      <text x="0" y="70" class="field-name">imagem</text>
      <text x="120" y="70" class="field-type">VARCHAR</text>

      <text x="0" y="90" class="field-name">qtd_estoque</text>
      <text x="120" y="90" class="field-type">INT</text>

      <text x="0" y="110" class="field-name">preco_unitario</text>
      <text x="120" y="110" class="field-type">DECIMAL</text>

      <text x="0" y="130" class="field-name">unidade</text>
      <text x="120" y="130" class="field-type">INT</text>

      <text x="0" y="150" class="field-name">tipo_produto</text>
      <text x="120" y="150" class="field-type">INT</text>

      <text x="0" y="170" class="field-name">ativo</text>
      <text x="120" y="170" class="field-type">BIT</text>
    </g>
  </g>

  <!-- 7. tb_banners (FLOATING UTILITY RIGHT-BOTTOM 1) -->
  <g transform="translate(595, 450)" filter="url(#shadow)">
    <rect width="170" height="110" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
    <rect width="170" height="25" rx="8" fill="#1d4ed8"/>
    <text x="12" y="17" class="table-header" font-size="11">tb_banners</text>
    
    <g transform="translate(12, 40)">
      <text x="0" y="10" class="field-name pk">id_banner</text>
      <text x="100" y="10" class="field-type">INT [PK]</text>
      
      <text x="0" y="25" class="field-name">imagem</text>
      <text x="100" y="25" class="field-type">VARCHAR</text>
      
      <text x="0" y="40" class="field-name">ativo</text>
      <text x="100" y="40" class="field-type">BIT</text>
    </g>
  </g>

  <!-- 8. tb_contatos (FLOATING UTILITY FAR-RIGHT BOTTOM) -->
  <g transform="translate(785, 450)" filter="url(#shadow)">
    <rect width="170" height="130" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
    <rect width="170" height="25" rx="8" fill="#1d4ed8"/>
    <text x="12" y="17" class="table-header" font-size="11">tb_contatos</text>
    
    <g transform="translate(12, 40)">
      <text x="0" y="10" class="field-name pk">id_contato</text>
      <text x="100" y="10" class="field-type">INT [PK]</text>
      
      <text x="0" y="25" class="field-name">nome</text>
      <text x="100" y="25" class="field-type">VARCHAR</text>
      
      <text x="0" y="40" class="field-name">e_mail</text>
      <text x="100" y="40" class="field-type">VARCHAR</text>

      <text x="0" y="55" class="field-name">mensagem</text>
      <text x="100" y="55" class="field-type">VARCHAR</text>
    </g>
  </g>
</svg>
